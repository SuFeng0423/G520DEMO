<body>
  <div class="glasses-screen glasses-screen--ai">

      <span><span class="glasses-screen__status-dot"></span>发票识别</span>
      <span>4 字段</span>
    </div>
    <div class="glasses-screen__body">
      <div class="glasses-screen__content" style="padding-top:6px;">

          <span class="ai-field-row__label">数量</span>
          <span class="ai-field-row__value">500</span>
          <span class="confidence-row__val confidence-row__val--pass">99%</span>
        </div>
        <div class="ai-field-row ai-field-row--warn">
          <span class="ai-field-row__label">供应商</span>
          <span class="ai-field-row__value">Bosch GmbH</span>
          <span class="confidence-row__val confidence-row__val--warn">72%</span>

      <div class="glasses-screen__footer">
