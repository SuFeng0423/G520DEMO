<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=640">
  <title>06 拍后自动同步 — 眼镜端</title>
  <link rel="stylesheet" href="../css/prototype.css?v=20260724c">
</head>
<body>
  <div class="glasses-screen glasses-screen--basic">
    <div class="glasses-screen__status">
      <span><span class="glasses-screen__status-dot"></span>拍照完成</span>
      <span>自动同步中</span>
    </div>
    <div class="glasses-screen__body">
      <div class="glasses-screen__content center-msg">
        <div class="auto-sync-flash">
          <div class="auto-sync-flash__shot">照片 #3</div>
          <div class="auto-sync-flash__arrow">→</div>
          <div class="auto-sync-flash__target">APK</div>
        </div>
        <div class="complete-title">已自动传至手机</div>
        <div class="center-msg--dim">无需确认 · 可继续下一张</div>
        <div class="transfer-bar transfer-bar--thin">
          <div class="transfer-bar__fill transfer-bar__fill--100"></div>
        </div>
      </div>
      <div class="glasses-screen__footer">
        <div class="glasses-screen__hint">同步完成后自动回到拍照界面</div>
      </div>
    </div>
  </div>
  <div class="nav-buttons nav-buttons--screen">
    <a class="nav-btn" href="05-inspection-preview-off.html">← 预览关</a>
    <a class="nav-btn" href="04-inspection-preview-on.html">继续拍照</a>
    <a class="nav-btn" href="apk/01-gallery.html">去 APK 查看 →</a>
    <a class="nav-btn" href="08-task-end.html">结束任务 →</a>
  </div>
  <script src="../js/flow-nav.js"></script>
</body>
</html>
