<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=640">
  <title>06 传输至 APK — 眼镜端</title>
  <link rel="stylesheet" href="../css/prototype.css">
</head>
<body>
  <div class="glasses-screen glasses-screen--basic">
    <div class="glasses-screen__status">
      <span><span class="glasses-screen__status-dot"></span>传图中</span>
      <span>3 张 → APK</span>
    </div>
    <div class="glasses-screen__body">
      <div class="glasses-screen__title">传输至手机 APK</div>
      <div class="glasses-screen__content">
        <div class="upload-layout">
          <div class="upload-layout__thumb">×3</div>
          <div class="upload-layout__info">
            <span class="match-badge match-badge--success">近场传输</span>
            <div class="detail-card__row">
              <span class="detail-card__label">工单</span>
              <span class="detail-card__value detail-card__value--highlight">SH20250702001</span>
            </div>
            <div class="detail-card__row">
              <span class="detail-card__label">目标</span>
              <span class="detail-card__value">手机 APK · 预览层</span>
            </div>
          </div>
        </div>
        <div class="transfer-bar">
          <div class="transfer-bar__fill transfer-bar__fill--68"></div>
        </div>
        <p class="layer-hint">眼镜不直连服务端上传；看图与正式提交在 APK 完成</p>
      </div>
      <div class="glasses-screen__footer">
        <div class="glasses-screen__hint">传输中请保持与手机连接</div>
      </div>
    </div>
  </div>
  <div class="nav-buttons nav-buttons--screen">
    <a class="nav-btn" href="05-inspection-preview-off.html">← 预览关</a>
    <a class="nav-btn" href="07-transfer-done.html">下一屏：传输完成 →</a>
  </div>
  <script src="../js/flow-nav.js"></script>
</body>
</html>
