<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=640">
  <title>07 上传留底 — 智能眼镜原型</title>
  <link rel="stylesheet" href="../css/prototype.css">
</head>
<body>
  <div class="glasses-screen glasses-screen--basic">
    <div class="glasses-screen__status">
      <span><span class="glasses-screen__status-dot"></span>上传留档</span>
      <span>3 张</span>
    </div>
    <div class="glasses-screen__body">
      <div class="glasses-screen__title">确认上传</div>
      <div class="glasses-screen__content">
        <div class="upload-layout">
          <div class="upload-layout__thumb">×3</div>
          <div class="upload-layout__info">
            <span class="match-badge match-badge--success">工单挂接</span>
            <div class="detail-card__row">
              <span class="detail-card__label">单号</span>
              <span class="detail-card__value detail-card__value--highlight">SH20250702001</span>
            </div>
          </div>
        </div>
      </div>
      <div class="glasses-screen__footer">
        <div class="glasses-screen__hint">● 确认上传 · 🎤「确认上传」</div>
      </div>
    </div>
  </div>
  <div class="nav-buttons" style="width:640px;margin-top:12px;">
    <a class="nav-btn" href="06-photo-review.html">← 照片回看</a>
    <a class="nav-btn" href="09-upload-complete.html">下一屏：上传完成 →</a>
  </div>
  <script src="../js/flow-nav.js"></script>
</body>
</html>
