<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=640">
  <title>08 上传异常 — 智能眼镜原型</title>
  <link rel="stylesheet" href="../css/prototype.css">
</head>
<body>
  <div class="glasses-screen glasses-screen--basic">
    <div class="glasses-screen__status">
      <span><span class="glasses-screen__status-dot"></span>上传失败</span>
      <span>已缓存</span>
    </div>
    <div class="glasses-screen__body">
      <div class="glasses-screen__title">网络异常</div>
      <div class="glasses-screen__content">
        <div class="center-msg">
          <span class="match-badge match-badge--fail">上传中断</span>
          <div class="center-msg--dim">3 张已本地缓存 · 恢复后补传</div>
        </div>
      </div>
      <div class="glasses-screen__footer">
        <div class="glasses-screen__hint">● 重试 · 🎤「稍后上传」</div>
      </div>
    </div>
  </div>
  <div class="nav-buttons" style="width:640px;margin-top:12px;">
    <a class="nav-btn" href="09-upload-complete.html">上传成功 →</a>
    <a class="nav-btn" href="04-inspection-preview-on.html">继续检查</a>
  </div>
  <script src="../js/flow-nav.js"></script>
</body>
</html>
