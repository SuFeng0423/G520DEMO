<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=360">
  <title>A04 一键提交 — APK</title>
  <link rel="stylesheet" href="../../css/prototype.css?v=20260724">
</head>
<body class="apk-page">
  <div class="phone-screen">
    <div class="phone-screen__status">
      <span>09:44</span>
      <span>提交中</span>
    </div>
    <div class="phone-screen__header">
      <div class="phone-screen__title">一键提交</div>
      <div class="phone-screen__sub">调用服务端上传 / 提交接口</div>
    </div>
    <div class="phone-screen__body apk-center">
      <div class="apk-submit-card">
        <div class="detail-card__row">
          <span class="detail-card__label">工单</span>
          <span class="detail-card__value detail-card__value--highlight">SH20250702001</span>
        </div>
        <div class="detail-card__row">
          <span class="detail-card__label">图片</span>
          <span class="detail-card__value">2 张待归档</span>
        </div>
        <div class="detail-card__row">
          <span class="detail-card__label">接口</span>
          <span class="detail-card__value">云宏方 · 上传 + 提交</span>
        </div>
        <div class="apk-progress">
          <div class="apk-progress__track">
            <div class="apk-progress__fill apk-progress__fill--68"></div>
          </div>
          <div class="apk-progress__meta">
            <span>上传中 2/2</span>
            <span>68%</span>
          </div>
        </div>
        <p class="apk-hint">提交进度条实时反馈 · 请勿退出应用</p>
      </div>
    </div>
    <div class="phone-screen__toolbar">
      <span class="apk-btn apk-btn--disabled">提交中…</span>
    </div>
  </div>
  <div class="nav-buttons nav-buttons--phone">
    <a class="nav-btn" href="01-gallery.html">← 相册</a>
    <a class="nav-btn" href="05-submit-done.html">下一屏：提交完成 →</a>
  </div>
  <script src="../../js/flow-nav.js"></script>
</body>
</html>
